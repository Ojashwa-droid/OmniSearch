spring.application.name=ojas-rag
logging.pattern.console=${LOGGING_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

# Gemini related properties
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

logging.level.com.ojashwa.springai=debug

# Omnisearch Configuration
omnisearch.tavily.api-url=https://api.tavily.com/search
omnisearch.tavily.api-key=${TAVILY_API_KEY:}
omnisearch.groq.api-key=${GROQ_API_KEY:}
omnisearch.upload.max-files=5
omnisearch.upload.max-file-size=20MB
omnisearch.upload.max-request-size=40MB
omnisearch.upload.max-document-characters=40000
omnisearch.upload.max-total-characters=100000
omnisearch.upload.tika-timeout=30s
omnisearch.groq.api-url=https://api.groq.com/openai/v1/audio/transcriptions
omnisearch.groq.model=whisper-large-v3-turbo

spring.servlet.multipart.max-file-size=${omnisearch.upload.max-file-size}
spring.servlet.multipart.max-request-size=${omnisearch.upload.max-request-size}

# Increase server timeout for long LLM calls (WebFlux)
server.netty.connection-timeout=300s
spring.mvc.async.request-timeout=1500000
