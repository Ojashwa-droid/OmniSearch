spring.application.name=ojas-rag
logging.pattern.console=${LOGGING_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

# Gemni related properties
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

# Ollama related properties
#spring.ai.model.chat=ollama
#spring.ai.ollama.chat.options.model=llama3.2:3b
#spring.ai.ollama.base-url=http://localhost:11434

logging.level.com.ojashwa.springai=debug

# Omnisearch Configuration
omnisearch.tavily.api-url=https://api.tavily.com/search

# Increase server timeout for long LLM calls (WebFlux)
server.netty.connection-timeout=300s
spring.mvc.async.request-timeout=120000
